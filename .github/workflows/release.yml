name: release

# Auto-trigger on every push to main: bump a semver tag from the commit history
# (conventional commits; patch by default) and publish the image to GHCR.
on:
  push:
    branches: [main]

permissions:
  contents: write # create the version tag / release
  packages: write # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tag action needs full history

      - name: Compute next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.new_version }}
            ghcr.io/${{ github.repository }}:latest
